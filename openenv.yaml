name: ContractReviewEnv
version: 1.0.0
description: >
  AI agent reviews legal contracts clause by clause, flagging risks
  scored against expert annotations using Precision, Recall, and F1.
tags: [openenv, legal, nlp, contract-review, real-world]
entry_point: server.env:ContractReviewEnv
baseline_script: inference.py
dockerfile: Dockerfile
contracts:
  - {id: C-001, type: NDA, clauses: 8, high_risk: 3}
  - {id: C-002, type: SaaS, clauses: 10, high_risk: 5}
  - {id: C-003, type: Employment, clauses: 10, high_risk: 4, buried: 1}
tasks:
  - {id: task_1_nda_high_risk, difficulty: easy, metric: recall_of_high_risk}
  - {id: task_2_saas_full_review, difficulty: medium, metric: f1_plus_bonus}
  - {id: task_3_employment_adversarial, difficulty: hard, metric: composite_buried}
reward:
  range: "-0.30 to +1.05 per step"
  components:
    detection: "TP +0.40 | FP -0.20 | FN -0.30 | TN +0.10"
    severity_accuracy: "0.0–0.25 partial credit"
    type_accuracy: "0.0–0.20"
    missing_protection: "0.0–0.05"
    explanation_quality: "0.0–0.10"
    buried_bonus: "+0.15"
